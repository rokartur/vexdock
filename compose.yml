# System stack. The installer copies this to /opt/platform/compose.yml and runs
# it from there; the updater recreates it with a new VERSION.
#
# PLATFORM_ROOT is mounted at the *same* path inside the manager so that bind
# mounts declared in user compose files resolve identically on host and in
# container.

services:
  manager:
    image: ghcr.io/vexdock/manager:${VERSION:-latest}
    container_name: vexdock-manager
    restart: unless-stopped

    environment:
      PLATFORM_ROOT: ${PLATFORM_ROOT:-/opt/platform}
      PLATFORM_LISTEN: ":8080"
      PLATFORM_VERSION: ${VERSION:-latest}
      PLATFORM_PROXY_NETWORK: vexdock-proxy
      PLATFORM_NGINX_CONTAINER: vexdock-nginx
      PLATFORM_PUBLIC_URL: ${PUBLIC_URL:-}
      PLATFORM_ACME_EMAIL: ${ACME_EMAIL:-}
      PLATFORM_ACME_STAGING: ${ACME_STAGING:-false}
      PLATFORM_LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLATFORM_ROOT:-/opt/platform}:${PLATFORM_ROOT:-/opt/platform}

    networks:
      - internal

  # better-auth owns login, sign-up and sessions. The manager reads its SQLite
  # file to authenticate requests, so there is one implementation of auth.
  auth:
    image: ghcr.io/vexdock/auth:${VERSION:-latest}
    container_name: vexdock-auth
    restart: unless-stopped

    environment:
      PLATFORM_ROOT: ${PLATFORM_ROOT:-/opt/platform}
      PLATFORM_PUBLIC_URL: ${PUBLIC_URL:-}
      PORT: "8081"

    volumes:
      - ${PLATFORM_ROOT:-/opt/platform}/data:${PLATFORM_ROOT:-/opt/platform}/data

    networks:
      - internal

  nginx:
    image: ghcr.io/vexdock/nginx:${VERSION:-latest}
    container_name: vexdock-nginx
    restart: unless-stopped

    depends_on:
      - manager
      - auth

    ports:
      - "80:80"
      - "443:443"
      - "${DASHBOARD_PORT:-3000}:3000"

    volumes:
      - ${PLATFORM_ROOT:-/opt/platform}/nginx/generated:/etc/nginx/generated:ro
      - ${PLATFORM_ROOT:-/opt/platform}/nginx/custom:/etc/nginx/custom:ro
      - ${PLATFORM_ROOT:-/opt/platform}/nginx/acme-challenge:/acme-challenge:ro
      - ${PLATFORM_ROOT:-/opt/platform}/certificates:/certificates:ro

    networks:
      - internal
      - proxy

networks:
  internal:
    name: vexdock-internal

  # Shared with every deployed service that has a domain.
  proxy:
    external: true
    name: vexdock-proxy
