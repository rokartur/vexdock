# System stack. The installer copies this to /opt/vexdock/compose.yml and runs
# it from there; the updater recreates it with a new VERSION.
#
# PLATFORM_ROOT is mounted at the *same* path inside the manager so that bind
# mounts declared in user compose files resolve identically on host and in
# container.
#
# REGISTRY is written by the installer from the repository it pulled from, so a
# fork publishes and consumes its own images without editing this file.

# Without a cap the platform's own logs grow until the host disk is full, which
# takes the panel down with them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  manager:
    image: ${REGISTRY:-ghcr.io/rokartur}/manager:${VERSION:-latest}
    container_name: vexdock-manager
    restart: unless-stopped
    logging: *logging

    environment:
      PLATFORM_ROOT: ${PLATFORM_ROOT:-/opt/vexdock}
      PLATFORM_LISTEN: ":8080"
      PLATFORM_VERSION: ${VERSION:-latest}
      PLATFORM_PROXY_NETWORK: vexdock-proxy
      PLATFORM_NGINX_CONTAINER: vexdock-nginx
      PLATFORM_PUBLIC_URL: ${PUBLIC_URL:-}
      PLATFORM_ACME_EMAIL: ${ACME_EMAIL:-}
      PLATFORM_ACME_STAGING: ${ACME_STAGING:-false}
      PLATFORM_LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLATFORM_ROOT:-/opt/vexdock}:${PLATFORM_ROOT:-/opt/vexdock}

    networks:
      - internal

  # better-auth owns login, sign-up and sessions. The manager reads its SQLite
  # file to authenticate requests, so there is one implementation of auth.
  auth:
    image: ${REGISTRY:-ghcr.io/rokartur}/auth:${VERSION:-latest}
    container_name: vexdock-auth
    restart: unless-stopped
    logging: *logging

    environment:
      PLATFORM_ROOT: ${PLATFORM_ROOT:-/opt/vexdock}
      PLATFORM_PUBLIC_URL: ${PUBLIC_URL:-}
      PORT: "8081"
      # Signs every session cookie. Required: booting without it would sign
      # sessions with a value shared by every install.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?written to .env by the installer}
      # Guards the one-time administrator sign-up on a publicly reachable panel.
      PLATFORM_SETUP_TOKEN: ${SETUP_TOKEN:-}

    volumes:
      - ${PLATFORM_ROOT:-/opt/vexdock}/data:${PLATFORM_ROOT:-/opt/vexdock}/data

    networks:
      - internal

  nginx:
    image: ${REGISTRY:-ghcr.io/rokartur}/nginx:${VERSION:-latest}
    container_name: vexdock-nginx
    restart: unless-stopped
    logging: *logging

    depends_on:
      - manager
      - auth

    ports:
      - "80:80"
      - "443:443"
      - "${DASHBOARD_PORT:-3000}:3000"

    volumes:
      - ${PLATFORM_ROOT:-/opt/vexdock}/nginx/generated:/etc/nginx/generated:ro
      - ${PLATFORM_ROOT:-/opt/vexdock}/nginx/custom:/etc/nginx/custom:ro
      - ${PLATFORM_ROOT:-/opt/vexdock}/nginx/acme-challenge:/acme-challenge:ro
      - ${PLATFORM_ROOT:-/opt/vexdock}/certificates:/certificates:ro

    networks:
      - internal
      - proxy

networks:
  internal:
    name: vexdock-internal

  # Shared with every deployed service that has a domain.
  proxy:
    external: true
    name: vexdock-proxy
