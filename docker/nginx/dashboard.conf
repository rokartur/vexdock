# The dashboard is always reachable on port 3000 by IP, even before the user
# attaches a domain. Adding a dashboard domain generates an extra vhost on
# 80/443 that serves exactly the same content.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything under /api/auth belongs to the better-auth service. Credential
    # endpoints are throttled at the proxy as well, so a flood never reaches
    # password hashing.
    location ~ ^/api/auth/(sign-in|sign-up|forget-password|reset-password) {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://auth:8081;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/auth/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://auth:8081;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://manager:8080;
        include /etc/nginx/proxy-headers.conf;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Deployment logs, container logs, stats and terminals are long-lived
        # streams: never buffer them and never time them out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed assets are immutable; the shell never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
