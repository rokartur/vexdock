# The dashboard is always reachable on port 3000 by IP, even before the user
# attaches a domain. Adding a dashboard domain generates an extra vhost on
# 80/443 that serves exactly the same content.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Login is the one endpoint worth throttling at the proxy as well as in the
    # manager, so a flood never reaches bcrypt.
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://manager:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://manager:8080;
        proxy_http_version 1.1;

        # $http_host keeps the port, which the terminal's same-origin check
        # compares against the browser's Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Deployment logs, container logs, stats and terminals are long-lived
        # streams: never buffer them and never time them out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed assets are immutable; the shell never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
