user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # WebSocket and SSE upgrades: only send the Connection: upgrade header when
    # the client actually asked for one, otherwise keep-alive breaks.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Login and API abuse protection, applied in the dashboard vhost.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # The dashboard on port 3000 (always available by IP) and the generated
    # per-domain vhosts.
    include /etc/nginx/dashboard/*.conf;
    include /etc/nginx/generated/*.conf;
    include /etc/nginx/custom/*.conf;

    # Requests for an unknown hostname must not leak whichever vhost happens to
    # be first.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /acme-challenge;
            default_type "text/plain";
        }

        location / {
            return 404;
        }
    }
}
