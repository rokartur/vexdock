# Included by every proxying location in dashboard.conf. Kept in one file so
# the three blocks cannot drift apart.
#
# $http_host keeps the port, which the terminal's same-origin check compares
# against the browser's Origin header.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
