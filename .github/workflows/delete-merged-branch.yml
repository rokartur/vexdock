name: Delete merged branch

# A merged pull request's branch has nothing left to say: its commits are on
# the base. Deleting it here, instead of trusting whoever merged to tick the
# box, keeps the branch list down to work that is still open.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete the head branch
    # Merged only (a closed-unmerged branch may still be wanted), this
    # repository's own branches only (a fork's is not ours, and its token is
    # read-only anyway), and never the default branch.
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Through the environment, never interpolated into the script: a
          # branch name is text anyone who can push a branch chooses.
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if out=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>&1); then
            echo "Deleted $BRANCH"
          elif printf '%s' "$out" | grep -q 'Reference does not exist'; then
            # Whoever merged already deleted it, e.g. scripts/release-beta.sh.
            echo "$BRANCH is already gone"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
