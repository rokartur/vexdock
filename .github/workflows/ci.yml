name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: Manager (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: manager/go.sum

      - name: Format check
        working-directory: manager
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: manager
        run: go vet ./...

      - name: Test
        working-directory: manager
        run: go test -race ./...

      - name: Build
        working-directory: manager
        run: CGO_ENABLED=0 go build ./...

  web:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: cd apps/web && bun run typecheck

      - name: Build
        run: cd apps/web && bun run build

  shell:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -s sh installer/*.sh
          shellcheck -s sh manager/internal/updater/update.sh
          shellcheck scripts/smoke-test.sh

  integration:
    name: Integration (real Docker)
    runs-on: ubuntu-latest
    needs: [manager, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        run: make dev-up

      - name: Run the end-to-end smoke test
        run: ./scripts/smoke-test.sh

      - name: Manager logs on failure
        if: failure()
        run: docker logs --tail 200 platform-manager
