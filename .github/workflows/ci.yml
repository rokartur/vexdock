name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Studio (runner-up-studio, arm64 container) while its heartbeat is fresh,
  # ubuntu-latest otherwise; a fork's pull request never reaches the Studio.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          BEAT: ${{ vars.STUDIO_HEARTBEAT }}
          FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          runner=ubuntu-latest
          if [ "$FORK" != true ] && [ $(( $(date +%s) - ${BEAT:-0} )) -lt 180 ]; then runner=runner-up-studio; fi
          echo "runner=$runner" | tee -a "$GITHUB_OUTPUT"

  manager:
    name: Manager (Rust)
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Studio's runner image ships neither a C compiler (ring, bundled
      # SQLite) nor rustup; ubuntu-latest has both and skips this.
      - name: Toolchain
        working-directory: manager
        run: |
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc
          fi
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          # rust-cache runs `rustc -vV` from the repo root, outside the toolchain file's reach.
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: manager

      - name: Format check
        working-directory: manager
        run: cargo fmt --check

      - name: Lint
        working-directory: manager
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: manager
        run: cargo test --locked

  web:
    name: Dashboard and auth (TypeScript)
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx vp check

      - name: Typecheck
        run: |
          cd apps/web && bun run typecheck
          cd ../auth && bun run typecheck

      - name: Build
        run: cd apps/web && bun run build

  shell:
    name: Installer (shellcheck)
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -s sh installer/*.sh
          shellcheck -s sh manager/src/updater/update.sh
          shellcheck scripts/smoke-test.sh scripts/release-beta.sh

  install:
    name: Installer (real run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one path every user takes and the only one the other jobs skip: the
    # installer script itself, against /opt/vexdock, with a real registry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cargo cache mounts in docker/*.Dockerfile die with the runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-image-cache
        with:
          path: |
            ${{ runner.temp }}/cargo-registry
            ${{ runner.temp }}/cargo-target
          key: cargo-image-ci-${{ hashFiles('manager/Cargo.lock', 'manager/rust-toolchain.toml', 'docker/manager.Dockerfile') }}
          restore-keys: cargo-image-ci-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/cargo-registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/cargo-target": "/src/target"
            }
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          skip-extraction: ${{ steps.cargo-image-cache.outputs.cache-hit }}

      - name: Publish the images to a local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          make -j4 --output-sync=target images VERSION=ci CARGO_PROFILE=ci
          for image in manager auth mcp nginx; do
            docker tag "vexdock-$image:ci" "localhost:5000/vexdock/$image:ci"
            docker push "localhost:5000/vexdock/$image:ci"
          done

      - name: Install
        # The runner's sudo ignores -E, so the variables go on the command line;
        # without them the installer pulls the latest release from ghcr.
        run: |
          sudo env PLATFORM_REGISTRY=localhost:5000 PLATFORM_LOCAL_COMPOSE=compose.yml PLATFORM_VERSION=ci \
            sh installer/install.sh

      - name: The installer generated its secrets
        run: |
          for key in BETTER_AUTH_SECRET SETUP_TOKEN; do
            value=$(sudo sed -n "s/^$key=//p" /opt/vexdock/.env)
            [ ${#value} -eq 64 ] || { echo "$key is '$value'"; exit 1; }
          done

      - name: Run the end-to-end smoke test
        run: |
          SETUP_TOKEN=$(sudo sed -n 's/^SETUP_TOKEN=//p' /opt/vexdock/.env) \
            ./scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 vexdock-manager || true
          docker logs --tail 200 vexdock-auth || true
          docker logs --tail 200 vexdock-mcp || true
