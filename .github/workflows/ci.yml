name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main's runs finish, so every merge saves the caches PRs restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manager:
    name: Manager (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs what manager/rust-toolchain.toml pins and makes it the default,
      # so rust-cache's `rustc -vV` from the repo root keys on it too.
      - name: Toolchain
        working-directory: manager
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: manager

      - name: Format check
        working-directory: manager
        run: cargo fmt --check

      - name: Lint
        working-directory: manager
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: manager
        run: cargo test --locked

  web:
    name: Dashboard and auth (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx vp check

      - name: Typecheck
        run: |
          cd apps/web && bun run typecheck
          cd ../auth && bun run typecheck

      - name: Test
        run: |
          cd apps/web && bun run test
          cd ../auth && bun run test

      - name: Build
        run: cd apps/web && bun run build

  shell:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck -s sh installer/*.sh
          shellcheck -s sh manager/src/updater/update.sh
          shellcheck scripts/smoke-test.sh scripts/release-beta.sh

  install:
    name: Installer (real run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one path every user takes and the only one the other jobs skip: the
    # installer script itself, against /opt/vexdock, with a real registry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Overlaps the pulls with the cache restore below. The last four are what smoke-test.sh deploys.
      - name: Pull base images in the background
        run: |
          for image in $(sed -n 's/^FROM \([^ ]*\).*/\1/p' docker/*.Dockerfile | sort -u) registry:2 \
            nginx:alpine httpd:alpine postgres:17-alpine curlimages/curl:latest; do
            nohup docker pull -q "$image" >/dev/null 2>&1 &
          done

      # The target mount in docker/*.Dockerfile dies with the runner. Registry stays out (fetch 3 s, inject 18 s);
      # restore-keys stop at the toolchain hash so a new rustc never inherits stale artifacts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-image-cache
        with:
          path: ${{ runner.temp }}/cargo-target
          key: cargo-image-ci-${{ hashFiles('manager/rust-toolchain.toml', 'docker/manager.Dockerfile', '.dockerignore') }}-${{ hashFiles('manager/Cargo.lock') }}
          restore-keys: cargo-image-ci-${{ hashFiles('manager/rust-toolchain.toml', 'docker/manager.Dockerfile', '.dockerignore') }}-

      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/cargo-target": "/src/target"
            }
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          skip-extraction: ${{ steps.cargo-image-cache.outputs.cache-hit }}

      - name: Publish the images to a local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          make -j4 --output-sync=target images VERSION=ci CARGO_PROFILE=ci
          for image in manager auth mcp nginx; do
            docker tag "vexdock-$image:ci" "localhost:5000/vexdock/$image:ci"
            docker push "localhost:5000/vexdock/$image:ci"
          done

      - name: Install
        # The runner's sudo ignores -E, so the variables go on the command line;
        # without them the installer pulls the latest release from ghcr.
        run: |
          sudo env PLATFORM_REGISTRY=localhost:5000 PLATFORM_LOCAL_COMPOSE=compose.yml PLATFORM_VERSION=ci \
            sh installer/install.sh

      - name: The installer generated its secrets
        run: |
          for key in BETTER_AUTH_SECRET SETUP_TOKEN; do
            value=$(sudo sed -n "s/^$key=//p" /opt/vexdock/.env)
            [ ${#value} -eq 64 ] || { echo "$key is '$value'"; exit 1; }
          done

      - name: Run the end-to-end smoke test
        run: |
          SETUP_TOKEN=$(sudo sed -n 's/^SETUP_TOKEN=//p' /opt/vexdock/.env) \
            ./scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 vexdock-manager || true
          docker logs --tail 200 vexdock-auth || true
          docker logs --tail 200 vexdock-mcp || true
