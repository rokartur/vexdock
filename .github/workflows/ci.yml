name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: Manager (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: manager/go.sum

      - name: Format check
        working-directory: manager
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        working-directory: manager
        run: go vet ./...

      - name: Test
        working-directory: manager
        run: go test -race ./...

      - name: Build
        working-directory: manager
        run: CGO_ENABLED=0 go build ./...

  web:
    name: Dashboard and auth (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          cd apps/web && bun run typecheck
          cd ../auth && bun run typecheck

      - name: Build
        run: cd apps/web && bun run build

  shell:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -s sh installer/*.sh
          shellcheck -s sh manager/internal/updater/update.sh
          shellcheck scripts/smoke-test.sh

  integration:
    name: Integration (real Docker)
    runs-on: ubuntu-latest
    needs: [manager, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        run: make dev-up

      - name: Run the end-to-end smoke test
        run: ./scripts/smoke-test.sh

      - name: Manager logs on failure
        if: failure()
        run: docker logs --tail 200 vexdock-manager

  install:
    name: Installer (real run)
    runs-on: ubuntu-latest
    needs: [manager, web]
    # The one path every user takes and the only one the other jobs skip: the
    # installer script itself, against /opt/platform, with a real registry.
    steps:
      - uses: actions/checkout@v4

      - name: Publish the images to a local registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          make images VERSION=ci
          for image in manager auth nginx; do
            docker tag "vexdock-$image:ci" "localhost:5000/$image:ci"
            docker push "localhost:5000/$image:ci"
          done

      - name: Install
        run: |
          export PLATFORM_REGISTRY=localhost:5000
          export PLATFORM_LOCAL_COMPOSE=compose.yml
          export PLATFORM_VERSION=ci
          sudo -E sh installer/install.sh

      - name: The installer generated its secrets
        run: |
          for key in BETTER_AUTH_SECRET SETUP_TOKEN; do
            value=$(sudo sed -n "s/^$key=//p" /opt/platform/.env)
            [ ${#value} -eq 64 ] || { echo "$key is '$value'"; exit 1; }
          done

      - name: Run the end-to-end smoke test
        run: |
          SETUP_TOKEN=$(sudo sed -n 's/^SETUP_TOKEN=//p' /opt/platform/.env) \
            ./scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 vexdock-manager || true
          docker logs --tail 200 vexdock-auth || true
