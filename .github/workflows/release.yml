name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  MANAGER: ghcr.io/${{ github.repository_owner }}/platform-manager
  AUTH: ghcr.io/${{ github.repository_owner }}/platform-auth
  PROXY: ghcr.io/${{ github.repository_owner }}/platform-nginx

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the release version; package.json files must say the same.
      - name: Versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for f in package.json apps/web/package.json apps/auth/package.json; do
            v=$(jq -r .version "$f")
            [ "v$v" = "$TAG" ] || { echo "$f is $v, tag is $TAG"; exit 1; }
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/manager.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.MANAGER }}:${{ github.ref_name }}
            ${{ env.MANAGER }}:latest

      - name: Auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/auth.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.AUTH }}:${{ github.ref_name }}
            ${{ env.AUTH }}:latest

      - name: Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PROXY }}:${{ github.ref_name }}
            ${{ env.PROXY }}:latest

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/install.sh
            compose.yml
