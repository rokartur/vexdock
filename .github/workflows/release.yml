name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  MANAGER: ghcr.io/${{ github.repository_owner }}/manager
  AUTH: ghcr.io/${{ github.repository_owner }}/auth
  PROXY: ghcr.io/${{ github.repository_owner }}/nginx
  # Links each GHCR package back to this repository.
  SOURCE: ${{ github.server_url }}/${{ github.repository }}

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Tags are vX.Y.Z; the package.json files carry the same X.Y.Z.
      - name: Versions match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for f in package.json apps/web/package.json apps/auth/package.json; do
            v=$(jq -r .version "$f")
            [ "v$v" = "$TAG" ] || { echo "$f is $v, tag is $TAG"; exit 1; }
          done

      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only. Two of these images run `bun install` while
      # building, and Bun under QEMU is slow enough to time out and prone
      # to crashing, so a cross-built release fails halfway with images
      # already pushed. Add arm64 on a native arm runner when asked for.
      - name: Manager image
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/manager.Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          tags: |
            ${{ env.MANAGER }}:${{ github.ref_name }}

      - name: Auth image
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/auth.Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          tags: |
            ${{ env.AUTH }}:${{ github.ref_name }}

      - name: Nginx image
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/nginx.Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          tags: |
            ${{ env.PROXY }}:${{ github.ref_name }}

      - name: Publish latest image tags
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          for image in "$MANAGER" "$AUTH" "$PROXY"; do
            docker buildx imagetools create \
              --tag "$image:latest" "$image:$GITHUB_REF_NAME"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          args=(--generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            installer/install.sh compose.yml
